[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "random-quote-api"
version = "1.0.0"
description = "A Flask REST API that serves random quotes"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0",
]
